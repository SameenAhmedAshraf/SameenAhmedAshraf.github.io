---
layout: none
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Park OS">
<meta name="theme-color" content="#07080f">
<link rel="manifest" href="manifest.json">
<title>PARK_OS</title>
<style>
:root{
  --bg:#07080f; --panel:rgba(255,255,255,.05); --panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.18);
  --txt:#e7ecf5; --dim:rgba(231,236,245,.55); --faint:rgba(231,236,245,.3);
  --vio:#8b5cf6; --cyan:#22d3ee; --lime:#a3e635; --pink:#fb7185; --amber:#fbbf24;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#06b6d4 100%);
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 400px at 85% -5%, rgba(139,92,246,.22), transparent 60%),
    radial-gradient(500px 380px at -10% 30%, rgba(34,211,238,.13), transparent 60%),
    radial-gradient(500px 500px at 50% 110%, rgba(163,230,53,.07), transparent 60%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:28px 28px}
#app{display:flex;flex-direction:column;height:100%;position:relative;z-index:1}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sb) + 96px)}

/* ── terminal header ── */
.hdr{padding:calc(var(--st) + 22px) 20px 4px}
.hdr .brand{font-family:var(--mono);font-size:26px;font-weight:800;letter-spacing:.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  display:inline-flex;align-items:center}
.hdr .brand .cur{display:inline-block;width:12px;height:24px;margin-left:6px;background:var(--cyan);
  -webkit-text-fill-color:initial;animation:blink 1.1s steps(1) infinite;border-radius:2px}
.hdr .sub{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:6px}
.hdr .sub b{color:var(--lime);font-weight:600}
@keyframes blink{50%{opacity:0}}

/* ── stat chips ── */
.stats{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.chip b{color:var(--cyan);font-weight:700}

/* ── sections ── */
.sec{margin:22px 0 0}
.sec-hdr{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--faint);
  text-transform:uppercase;padding:0 20px 10px;display:flex;align-items:center;gap:8px}
.sec-hdr::after{content:'';flex:1;height:1px;background:var(--line);margin-right:20px}

/* ── complex pills ── */
.cxrow{display:flex;gap:10px;overflow-x:auto;padding:0 20px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cxrow::-webkit-scrollbar{display:none}
.cx{flex-shrink:0;border:1px solid var(--line);background:var(--panel);border-radius:16px;
  padding:12px 16px;min-width:132px;cursor:pointer;color:var(--txt);text-align:left;font-family:inherit;
  transition:border-color .18s,box-shadow .18s,transform .12s}
.cx:active{transform:scale(.97)}
.cx .nm{font-size:15px;font-weight:700}
.cx .ap{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
.cx .ap.warn{color:var(--pink)}
.cx.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(34,211,238,.25)}
.cx.on .ap{color:var(--cyan)}
.cx.dur{min-width:0;padding:10px 14px}
.cx.dur .nm{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}
.durhint{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:8px 20px 0;line-height:1.5}

/* ── THE LOT (parking grid) ── */
.lot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.slot{position:relative;border:2px dashed rgba(251,191,36,.28);border-radius:16px;background:rgba(255,255,255,.025);
  padding:14px;cursor:pointer;color:var(--txt);text-align:left;font-family:inherit;
  transition:border-color .2s,box-shadow .2s,background .2s,transform .12s}
.slot:active{transform:scale(.97)}
.slot .num{position:absolute;top:8px;right:12px;font-family:var(--mono);font-size:10px;color:var(--faint)}
.slot .car{font-size:30px;line-height:1;display:block;filter:grayscale(.9);opacity:.55;
  transition:filter .25s,opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.slot .who{font-size:14px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .veh{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .plate{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;
  color:#a5f3fc;background:#0b1524;border:1px solid #29405e;border-radius:6px;padding:3px 8px;margin-top:8px}
.slot.parked{border:2px solid var(--lime);background:rgba(163,230,53,.07);
  box-shadow:0 0 18px rgba(163,230,53,.18), inset 0 0 22px rgba(163,230,53,.05)}
.slot.parked .car{filter:none;opacity:1;transform:translateX(0) rotate(0)}
.slot.parked .carwrap .car{animation:parkin .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes parkin{0%{transform:translateX(-46px) rotate(-8deg);opacity:.4}100%{transform:translateX(0) rotate(0);opacity:1}}
.slot.add{border-style:dashed;border-color:var(--line2);display:flex;align-items:center;justify-content:center;
  min-height:118px;color:var(--dim);font-size:14px;font-weight:600;gap:6px}
.slot.add span.plus{font-size:22px;color:var(--cyan)}
.lot-empty{margin:0 20px;padding:34px 20px;border:2px dashed var(--line2);border-radius:18px;text-align:center;color:var(--dim)}
.lot-empty .big{font-size:40px;margin-bottom:10px}
.lot-empty p{font-size:14px;line-height:1.5}

/* ── run button ── */
.runwrap{padding:22px 20px 0}
.run{width:100%;border:none;border-radius:18px;padding:17px;font-size:16px;font-weight:800;
  font-family:var(--mono);letter-spacing:.06em;color:#04121a;background:var(--grad);cursor:pointer;
  box-shadow:0 6px 30px rgba(34,211,238,.35);transition:transform .12s,box-shadow .2s,opacity .2s}
.run:active{transform:scale(.98)}
.run:disabled{opacity:.3;box-shadow:none}
.run.armed{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 26px rgba(34,211,238,.3)}50%{box-shadow:0 6px 40px rgba(139,92,246,.55)}}
.ready{margin:12px 20px 0;font-family:var(--mono);font-size:12px;color:var(--lime);line-height:1.6}
.ready .dim{color:var(--dim)}

/* ── launch overlay ── */
.launch{position:fixed;inset:0;z-index:400;pointer-events:none;overflow:hidden}
.launch .zoom{position:absolute;left:-15%;font-size:38px;animation:zoomacross 1s cubic-bezier(.45,0,.55,1) forwards}
@keyframes zoomacross{0%{transform:translateX(0)}100%{transform:translateX(130vw)}}

/* ── garage list ── */
.glist{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--txt);text-align:left;font-family:inherit;width:100%;
  transition:border-color .15s,transform .12s}
.gcard:active{transform:scale(.98)}
.gcard .emoji{font-size:28px}
.gcard .gb{flex:1;min-width:0}
.gcard .gt{font-size:16px;font-weight:700}
.gcard .gs{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .chev{color:var(--faint);font-family:var(--mono)}

/* ── generic buttons ── */
.btn{display:block;width:calc(100% - 40px);margin:18px 20px 0;padding:15px;border-radius:16px;border:1px solid var(--line2);
  font-size:15px;font-weight:700;cursor:pointer;background:var(--panel2);color:var(--txt);font-family:inherit;
  transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.grad{background:var(--grad);border:none;color:#04121a;font-family:var(--mono);letter-spacing:.04em}
.btn.danger{color:var(--pink);border-color:rgba(251,113,133,.35)}

/* ── tab bar ── */
.tabs{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 12px);z-index:100;display:flex;
  background:rgba(13,15,26,.82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  border:1px solid var(--line2);border-radius:22px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;
  color:var(--faint);padding:7px 0;font-family:var(--mono);border-radius:15px;transition:color .15s,background .15s}
.tab svg{width:22px;height:22px}
.tab span{font-size:9.5px;letter-spacing:.14em;font-weight:700}
.tab.on{color:var(--cyan);background:rgba(34,211,238,.1)}

/* ── sheets/modals ── */
.overlay{position:fixed;inset:0;background:rgba(3,4,10,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  z-index:200;display:flex;flex-direction:column;justify-content:flex-end;animation:fi .18s ease}
.sheet{background:#0c0e1a;border:1px solid var(--line2);border-bottom:none;border-radius:24px 24px 0 0;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--sb) + 14px);animation:su .3s cubic-bezier(.32,.72,.35,1)}
.handle{width:38px;height:5px;background:var(--line2);border-radius:3px;margin:12px auto 2px}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 12px}
.mnav .ttl{font-family:var(--mono);font-size:15px;font-weight:800;letter-spacing:.06em}
.mbtn{background:none;border:none;color:var(--cyan);font-size:16px;font-weight:600;padding:10px 12px;cursor:pointer;font-family:inherit}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(70px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── form fields ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:0 20px;overflow:hidden}
.ff{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);min-height:48px;gap:10px}
.ff:last-child{border-bottom:none}
.ff label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--dim);width:96px;flex-shrink:0;text-transform:uppercase}
.ff input{flex:1;font-size:16px;border:none;outline:none;background:transparent;color:var(--txt);font-family:inherit;min-width:0}
.ff input::placeholder{color:var(--faint)}
.ff.col{flex-direction:column;align-items:stretch;gap:8px}
.ff.col label{width:auto}
.mhint{margin:14px 20px 0;padding:13px 15px;border:1px solid rgba(34,211,238,.25);background:rgba(34,211,238,.07);
  border-radius:14px;font-size:13px;color:var(--dim);line-height:1.6}
.mhint b{color:var(--cyan)}
.mhint.ok{border-color:rgba(163,230,53,.3);background:rgba(163,230,53,.07)}
.mhint.ok b{color:var(--lime)}

/* setup steps */
.step{display:flex;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.step:last-child{border-bottom:none}
.step .n{font-family:var(--mono);width:26px;height:26px;border-radius:8px;background:var(--grad);color:#04121a;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.step .b{flex:1;font-size:14px;line-height:1.55;color:var(--txt)}
.step .b .d{font-size:12px;color:var(--dim)}
.step .b a{color:var(--cyan);font-weight:700;text-decoration:none}
.step .b strong{font-weight:700}

.empty{ text-align:center;padding:56px 20px;color:var(--dim)}
.empty .ico{font-size:48px;margin-bottom:12px}
.empty h3{font-size:18px;font-weight:800;color:var(--txt);margin-bottom:6px;font-family:var(--mono)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── State ──────────────────────────────────────────────────────────────────
const S={tab:'reg',modal:null,sel:{cid:null,carids:[]},draft:{},draftCar:{},launching:false};

let complexes=load('complexes2')||[
  {id:uid(),name:'Luca',addr:'',apt:'4060',url:'https://www.register2park.com/',code:''},
  {id:uid(),name:'Callista Hill Country',addr:'',apt:'728',url:'https://www.register2park.com/',code:''},
  {id:uid(),name:'Complex 3',addr:'',apt:'',url:'https://www.register2park.com/',code:''},
];
let cars=load('cars')||[];

const CAR_EMOJI=['🚗','🚙','🏎️','🚘','🛻','🚕'];
const DURATIONS=[
  {d:-1,lbl:'off — just today'},
  {d:1, lbl:'1 day'},
  {d:3, lbl:'3 days'},
  {d:7, lbl:'1 week'},
  {d:14,lbl:'2 weeks'},
  {d:30,lbl:'30 days'},
  {d:0, lbl:'until stopped'},
];
S.autoDays=load('autodays')??-1;
function durLabel(d){const o=DURATIONS.find(x=>x.d===d);return o?('auto: '+o.lbl):'auto: off'}
function setDays(d){S.autoDays=d;ls('autodays',d);render()}

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function saveAll(){ls('complexes2',complexes);ls('cars',cars)}
function ls(k,v){localStorage.setItem(k,JSON.stringify(v))}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function selC(){return complexes.find(c=>c.id===S.sel.cid)}
function selCars(){return cars.filter(c=>S.sel.carids.includes(c.id))}
function emojiFor(id){const i=cars.findIndex(c=>c.id===id);return CAR_EMOJI[(i<0?0:i)%CAR_EMOJI.length]}
function regCount(){return load('regcount')||0}

// ── Clipboard payload (multi-car; legacy single-car fields kept) ───────────
function buildClipboardData(cx, list){
  const first=list[0]||{};
  return JSON.stringify({
    url: cx.url||'https://www.register2park.com/',
    apt: cx.apt||'', code: cx.code||'',
    days: S.autoDays||0,
    cars: list.map(c=>({label:c.label||'',make:c.make||'',model:c.model||'',plate:c.plate||'',email:c.email||''})),
    make:first.make||'',model:first.model||'',plate:first.plate||'',email:first.email||'',label:first.label||'',
  });
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  let h=`<div class="scr">`;
  if(S.tab==='reg') h+=viewReg();
  else if(S.tab==='cars') h+=viewGarage();
  else h+=viewComplexes();
  h+=`</div><div class="tabs">${renderTabs()}</div>`;
  if(S.modal==='car') h+=modalCar();
  else if(S.modal==='complex') h+=modalComplex();
  else if(S.modal==='autofill') h+=modalAutoFill();
  if(S.launching) h+=launchOverlay();
  document.getElementById('app').innerHTML=h;
}

function renderTabs(){
  return [
    {id:'reg',lbl:'REGISTER',ico:iBolt()},
    {id:'cars',lbl:'GARAGE',ico:iCar()},
    {id:'complexes',lbl:'BASES',ico:iBuilding()},
  ].map(t=>`<button class="tab ${S.tab===t.id?'on':''}" onclick="setTab('${t.id}')">${t.ico}<span>${t.lbl}</span></button>`).join('');
}

// ── REGISTER ───────────────────────────────────────────────────────────────
function viewReg(){
  const cx=selC(), sel=selCars(), canGo=cx&&sel.length>0;
  return `
  <div class="hdr">
    <div class="brand">PARK_OS<span class="cur"></span></div>
    <div class="sub">&gt; visitor parking on <b>autopilot</b></div>
  </div>

  <div class="stats">
    <span class="chip">runs <b>${regCount()}</b></span>
    <span class="chip">garage <b>${cars.length}</b></span>
    <span class="chip">selected <b>${sel.length}</b></span>
  </div>

  <div class="sec"><div class="sec-hdr">01 · base</div>
    <div class="cxrow">
      ${complexes.map(c=>`
      <button class="cx ${S.sel.cid===c.id?'on':''}" onclick="pickC('${c.id}')">
        <div class="nm">${esc(c.name)}</div>
        ${c.apt?`<div class="ap">APT ${esc(c.apt)}</div>`:`<div class="ap warn">! apt not set</div>`}
      </button>`).join('')}
    </div>
  </div>

  <div class="sec"><div class="sec-hdr">02 · the lot — tap cars to park</div>
    ${cars.length===0?`
    <div class="lot-empty">
      <div class="big">🅿️</div>
      <p>The lot is empty.<br>Add your regulars in the <b>Garage</b> — register them forever with one tap.</p>
    </div>
    <button class="btn grad" onclick="quickAddCar()">+ ADD FIRST CAR</button>`
    :`<div class="lot">
      ${cars.map((c,i)=>{
        const on=S.sel.carids.includes(c.id);
        return `
        <button class="slot ${on?'parked':''}" onclick="toggleCar('${c.id}')">
          <span class="num">SLOT ${String(i+1).padStart(2,'0')}</span>
          <span class="carwrap"><span class="car">${CAR_EMOJI[i%CAR_EMOJI.length]}</span></span>
          <div class="who">${esc(c.label||c.make||'Car '+(i+1))}</div>
          <div class="veh">${esc([c.make,c.model].filter(Boolean).join(' ')||'—')}</div>
          <span class="plate">${esc(c.plate||'———')}</span>
        </button>`;}).join('')}
      <button class="slot add" onclick="quickAddCar()"><span class="plus">+</span> new car</button>
    </div>`}
  </div>

  <div class="sec"><div class="sec-hdr">03 · auto-run length</div>
    <div class="cxrow">
      ${DURATIONS.map(o=>`
      <button class="cx dur ${S.autoDays===o.d?'on':''}" onclick="setDays(${o.d})">
        <div class="nm">${o.lbl}</div>
      </button>`).join('')}
    </div>
    <div class="durhint">For ParkAuto daily runs. "off" = one-time registration only (visitor here just today); a length makes ParkAuto repeat daily then stop itself.</div>
  </div>

  ${canGo?`<div class="ready">✔ ${sel.length} car${sel.length>1?'s':''} queued → <b>${esc(cx.name)}</b> · APT ${esc(cx.apt)}<br>
    <span class="dim">${sel.map(c=>esc(c.label||c.plate)).join(' · ')} · ${esc(durLabel(S.autoDays))}</span></div>`:''}

  <div class="runwrap">
    <button class="run ${canGo?'armed':''}" ${canGo?'':'disabled'} onclick="doRegister()">
      ▶ RUN PARKFILL${sel.length>1?' ×'+sel.length:''}
    </button>
  </div>`;
}

// ── GARAGE ─────────────────────────────────────────────────────────────────
function viewGarage(){
  return `
  <div class="hdr">
    <div class="brand">GARAGE<span class="cur"></span></div>
    <div class="sub">&gt; your regulars, saved once</div>
  </div>
  <div class="sec"><div class="sec-hdr">${cars.length} vehicle${cars.length===1?'':'s'}</div>
  ${cars.length===0?`<div class="empty"><div class="ico">🚗</div><h3>GARAGE EMPTY</h3><p>Add a visitor's car once, reuse it forever.</p></div>`:`
  <div class="glist">
    ${cars.map((c,i)=>`
    <button class="gcard" onclick="editCar('${c.id}')">
      <span class="emoji">${CAR_EMOJI[i%CAR_EMOJI.length]}</span>
      <div class="gb">
        <div class="gt">${esc(c.label||[c.make,c.model].filter(Boolean).join(' ')||'Car '+(i+1))}</div>
        <div class="gs">${esc([c.make,c.model].filter(Boolean).join(' '))}${c.plate?' · '+esc(c.plate):''}${c.email?' · '+esc(c.email):''}</div>
      </div>
      <span class="chev">&gt;</span>
    </button>`).join('')}
  </div>`}
  <button class="btn grad" onclick="quickAddCar()">+ ADD CAR</button>
  </div>`;
}

// ── BASES ──────────────────────────────────────────────────────────────────
function viewComplexes(){
  return `
  <div class="hdr">
    <div class="brand">BASES<span class="cur"></span></div>
    <div class="sub">&gt; your complexes &amp; their register2park links</div>
  </div>
  <div class="sec"><div class="sec-hdr">${complexes.length} saved</div>
  <div class="glist">
    ${complexes.map(c=>`
    <button class="gcard" onclick="editComplex('${c.id}')">
      <span class="emoji">🏢</span>
      <div class="gb">
        <div class="gt">${esc(c.name)}</div>
        <div class="gs">${c.apt?'APT '+esc(c.apt):'⚠ apt not set'}${c.url&&c.url!=='https://www.register2park.com/'?' · link ✓':' · ⚠ link not set'}</div>
      </div>
      <span class="chev">&gt;</span>
    </button>`).join('')}
  </div>

// ── Actions ────────────────────────────────────────────────────────────────
function setTab(t){S.tab=t;render()}
function pickC(id){S.sel.cid=id;render()}
function toggleCar(id){
  const i=S.sel.carids.indexOf(id);
  if(i>=0)S.sel.carids.splice(i,1);else S.sel.carids.push(id);
  render();
}
function closeModal(){S.modal=null;render()}

function doRegister(){
  const cx=selC(), sel=selCars(); if(!cx||!sel.length) return;
  copyText(buildClipboardData(cx,sel)).finally(()=>{
    ls('regcount',regCount()+sel.length);
    S.launching=true;render();
    setTimeout(()=>{S.launching=false;S.modal='autofill';render();},1050);
  });
}

function markSetupDone(){
  localStorage.setItem('scriptable_setup','1');
  S.modal='autofill';render();
}

function reCopy(){
  const cx=selC(), sel=selCars(); if(!cx||!sel.length) return;
  copyText(buildClipboardData(cx,sel)).then(()=>{
    const b=document.getElementById('rbtn');
    if(b){b.textContent='✅ copied';setTimeout(()=>{const x=document.getElementById('rbtn');if(x)x.textContent='📋 copy data again';},1800);}
  });
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res,rej)=>{
    const el=document.createElement('textarea');
    el.value=t;el.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(el);el.focus();el.select();
    try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}
    document.body.removeChild(el);
  });
}

function quickAddCar(){S.draftCar={};S.modal='car';render()}
function editCar(id){const c=cars.find(x=>x.id===id);S.draftCar={...c};S.modal='car';render()}
function saveCar(){
  const d=S.draftCar;
  if(!d.plate&&!d.make){alert('Enter at least a plate or make.');return}
  d.id=d.id||uid();
  const idx=cars.findIndex(c=>c.id===d.id);
  if(idx>=0)cars[idx]={...d};else cars.push({...d});
  saveAll();S.modal=null;render();
}
function deleteCar(id){
  if(!confirm('Delete this car?'))return;
  cars=cars.filter(c=>c.id!==id);
  S.sel.carids=S.sel.carids.filter(x=>x!==id);
  saveAll();S.modal=null;render();
}

function addComplex(){S.draft={url:'https://www.register2park.com/'};S.modal='complex';render()}
function editComplex(id){const c=complexes.find(x=>x.id===id);S.draft={...c};S.modal='complex';render()}
function saveComplex(){
  const d=S.draft;
  if(!d.name){alert('Give the base a name.');return}
  d.id=d.id||uid();
  const idx=complexes.findIndex(c=>c.id===d.id);
  if(idx>=0)complexes[idx]={...d};else complexes.push({...d});
  saveAll();S.modal=null;render();
}
function deleteComplex(id){
  if(!confirm('Delete this base?'))return;
  complexes=complexes.filter(c=>c.id!==id);
  if(S.sel.cid===id)S.sel.cid=null;
  saveAll();S.modal=null;render();
}
